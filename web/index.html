<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim triage</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: .6rem; font-weight: 600; }
  input, textarea { width: 100%; padding: .4rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: .5rem 1rem; }
  pre { background: #f4f4f4; padding: .8rem; overflow-x: auto; }
  .escalated { color: #b00020; font-weight: 600; }
</style>
</head>
<body>
<h1>Motor claim intake and triage</h1>
<p>This tool recommends. A human claims handler decides.</p>
<label>Policy number <input id="policy_number" value="POL-TEST-0001"></label>
<label>Date of loss <input id="date_of_loss" type="date"></label>
<label>Vehicle registration <input id="vehicle_registration" value="KA01AB1234"></label>
<label>What happened <textarea id="description" rows="4">I was making a food delivery run in my own car when the accident happened.</textarea></label>
<button id="go">Submit</button>
<h2>Result</h2>
<div id="status">Nothing submitted yet.</div>
<div id="out"></div>
<script>
const API = new URLSearchParams(location.search).get("api") || (location.protocol + "//" + location.hostname + ":8000");
const TERMINAL = ["completed", "escalated", "degraded", "failed"];
document.getElementById("date_of_loss").valueAsDate = new Date();
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

document.getElementById("go").onclick = async () => {
  const body = {};
  for (const id of ["policy_number", "date_of_loss", "vehicle_registration", "description"]) {
    body[id] = document.getElementById(id).value;
  }
  const status = document.getElementById("status"), out = document.getElementById("out");
  out.innerHTML = ""; status.textContent = "Submitting...";
  const r = await fetch(API + "/claims", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json();
  if (r.status !== 202) { status.textContent = "Rejected"; out.innerHTML = "<pre>" + esc(JSON.stringify(data, null, 2)) + "</pre>"; return; }
  while (true) {
    const run = await (await fetch(API + "/runs/" + data.run_id)).json();
    status.textContent = "Run " + data.run_id + ": " + run.status;
    if (TERMINAL.includes(run.status)) { render(run); return; }
    await new Promise(res => setTimeout(res, 1000));
  }
};

function render(run) {
  const res = run.result || {}, cov = res.coverage || {}, rt = res.routing || {};
  const cites = (cov.citations || []).map(c => "<li>" + esc(c.clause_id) + " (p." + esc(c.page) + ") " + esc(c.quote || "") + "</li>").join("");
  document.getElementById("out").innerHTML =
    "<h3>Recommendation: " + esc(cov.position) + "</h3><p>" + esc(cov.summary) + "</p>" +
    "<h3>Route: " + esc(rt.route) + "</h3><p>" + esc(rt.reason) + "</p>" +
    (rt.escalated ? "<p class='escalated'>Escalated to a human claims handler.</p>" : "") +
    "<h3>Citations</h3><ul>" + (cites || "<li>None</li>") + "</ul>";
}
</script>
</body>
</html>
