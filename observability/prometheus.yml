global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: verifier
    static_configs:
      - targets: ["verifier:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: retrieval
    static_configs:
      - targets: ["retrieval:8000"]
