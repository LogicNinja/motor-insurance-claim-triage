    distractors: [commercial_endorsement_distractor]
    expected: {positions: [potentially_not_covered, escalate], routes: [investigation, human_review], citations: [limitations_chapter4]}
  - id: fire_accidental_damage
    fnol: {policy_number: POL-EVAL-015, date_of_loss: "2026-10-19", vehicle_registration: KA01AB1015, description: "An accidental electrical fire damaged my car while parked in my driveway."}
    supporting_passages: [own_damage_vi, general_exception_iii_a]
    distractors: [purchase_docs_distractor]
    expected: {positions: [potentially_covered, potentially_not_covered, escalate], routes: [surveyor, fast_track, human_review], citations: [own_damage_vi]}
  - id: low_value_claim
    fnol: {policy_number: POL-EVAL-016, date_of_loss: "2026-10-20", vehicle_registration: KA01AB1016, description: "My car was scratched when a shopping cart rolled into it in a parking lot.", estimated_damage_inr: 8000}
    supporting_passages: [own_damage_vi]
    distractors: [purchase_docs_distractor]
    expected: {positions: [potentially_covered, potentially_not_covered], routes: [fast_track, surveyor, human_review], citations: [own_damage_vi]}
  - id: high_value_claim
    fnol: {policy_number: POL-EVAL-017, date_of_loss: "2026-10-21", vehicle_registration: KA01AB1017, description: "A falling tree crushed the roof of my car during a storm.", estimated_damage_inr: 350000}
    supporting_passages: [own_damage_vi, general_exception_iii_a]
    distractors: [purchase_docs_distractor]
    expected: {positions: [escalate], routes: [human_review], escalated: true, citations: [claim_procedure_ch6]}
  - id: claim_timeline_question
    fnol: {policy_number: POL-EVAL-018, date_of_loss: "2026-10-22", vehicle_registration: KA01AB1018, description: "My car was damaged in an accident. What are the claim assessment and decision timelines?", estimated_damage_inr: 30000}
    supporting_passages: [claim_procedure_ch6]
    distractors: [purchase_docs_distractor]
    expected: {positions: [escalate], routes: [human_review], escalated: true, flags_any: [claim_process_question], citations: [claim_procedure_ch6]}
  - id: private_car_vs_goods_vehicle
    fnol: {policy_number: POL-EVAL-019, date_of_loss: "2026-10-23", vehicle_registration: KA01AB1019, description: "My private car was damaged in a collision; it is not a goods vehicle.", estimated_damage_inr: 27000}
    supporting_passages: [own_damage_vi, general_exception_iii_a]
    distractors: [commercial_endorsement_distractor]
    expected: {positions: [potentially_covered, potentially_not_covered, escalate], routes: [surveyor, human_review], citations: [own_damage_vi], forbidden_citations: [commercial_endorsement_distractor]}
  - id: collision_unknown_circumstances
    fnol: {policy_number: POL-EVAL-020, date_of_loss: "2026-10-24", vehicle_registration: KA01AB1020, description: "I found fresh damage to my car after returning to the parking lot; the cause is unknown."}
    supporting_passages: [own_damage_vi, general_exception_iii_a]
    distractors: [purchase_docs_distractor]
    expected: {positions: [potentially_covered, potentially_not_covered, escalate], routes: [surveyor, human_review], citations: [own_damage_vi]}
  - id: policy_timeline_conflict_explicit
    fnol: {policy_number: POL-EVAL-021, date_of_loss: "2026-10-25", vehicle_registration: KA01AB1021, description: "My car has collision damage. Does the 15-day assessment clock start at survey or after the insurer requests a report?", estimated_damage_inr: 32000}
    supporting_passages: [claim_procedure_ch6, citizen_charter]
