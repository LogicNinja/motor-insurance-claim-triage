    expected: {positions: [escalate], routes: [human_review], escalated: true, flags_any: [source_conflict], events_any: [cross_source_evidence_retrieved], citations: [claim_procedure_ch6, citizen_charter], must_not_contain: ["there is no discrepancy"]}
